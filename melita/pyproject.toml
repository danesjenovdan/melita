[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "melita"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "Django==6.1.2",
    "psycopg2-binary==2.9.13",
    "boto3==1.43.122",
    "django-storages==1.14.6",
    "gunicorn==26.2.0",
    "Pillow==13.0.0",
    "sentry-sdk==2.73.0",
    "python-dateutil==2.9.0",
    "requests==2.34.2",
    "django-jsonify==0.3.0",
    "beautifulsoup4==4.15.0",
    "django-filter==26.2",
    "django-modelcluster==6.5",
    "djangorestframework==3.18.3",
    "wagtail==8.1",
    "wagtail-autocomplete==1.0.0",
    "wagtail-modeladmin==2.5.0",
    "pyicu==2.17",
]

[dependency-groups]
dev = [
    "black==26.10.1",
    "django-stubs==6.1.2",
    "django-stubs-ext==6.1.2",
    "ipython==9.18.0",
    "isort",
]

[tool.setuptools.packages.find]
include = ["home*", "melita*"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
